apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-test
  labels:
    app.kubernetes.io/name: sentiment-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentiment-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentiment-test
    spec:
      containers:
        - name: sentiment-test
          image: sentiment-test:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
            - name: metrics
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
